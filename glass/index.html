<!doctype html>
<html lang="ru" data-theme="liquid-glass">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hat/favicon.svg" />
    <link rel="apple-touch-icon" href="/hat/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Шляпа — Liquid Glass" />
    <title>Шляпа — Liquid Glass Edition</title>
    <!-- Preconnect to Google Fonts & gstatic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-render-blocking Google Fonts with print/all swap pattern -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- Telegram WebApp SDK (deferred to not block rendering) -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QFSVFWHCKK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QFSVFWHCKK');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply the saved/system color scheme and force liquid glass theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mantine-color-scheme-value');
          var scheme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
          document.documentElement.setAttribute('data-theme', 'liquid-glass');
          localStorage.setItem('hat-theme-liquid-glass', 'true');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
