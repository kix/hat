<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Шляпа</title>
    <script>
      // Single Page Apps for GitHub Pages redirection script
      var pathSegmentsToKeep = 1; // /hat/ is 1 segment
      var l = window.location;
      var isGlass = l.pathname.indexOf('/glass') !== -1;
      var redirectTarget = isGlass ? '/hat/glass/' : '/hat/';
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        redirectTarget +
        (l.search ? l.search : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
