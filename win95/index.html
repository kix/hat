<!doctype html>
<html lang="ru" data-theme="win95">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hat/favicon.svg" />
    <link rel="apple-touch-icon" href="/hat/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#008080" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Шляпа 95" />
    <title>Шляпа — Windows 95 Edition</title>
    <!-- Preconnect to Google Fonts & gstatic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Telegram WebApp SDK (deferred to not block rendering) -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QFSVFWHCKK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QFSVFWHCKK');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Force Windows 95 theme attribute -->
    <script>
      (function () {
        try {
          document.documentElement.setAttribute('data-theme', 'win95');
          document.documentElement.setAttribute('data-mantine-color-scheme', 'light');
          localStorage.setItem('hat-design-theme-mode', 'win95');
          localStorage.setItem('hat-theme-liquid-glass', 'false');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
